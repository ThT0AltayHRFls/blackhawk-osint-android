name: Build and Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore BlackHawk.csproj

      - name: Publish APK
        run: dotnet publish BlackHawk.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -p:ApplicationVersion=3 -p:ApplicationDisplayVersion=1.0.2

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK=$(find bin/Release/net10.0-android -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" release/blackhawk-osint-v1.0.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackHawk-APK-v1.0.2
          path: release/blackhawk-osint-v1.0.2.apk

      - name: Publish stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-build.${{ github.run_number }}
          name: BlackHawk OSINT v1.0.2 · Build ${{ github.run_number }}
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release/blackhawk-osint-v1.0.2.apk
          body: |
            ## BlackHawk OSINT Android

            Stable Android APK with the launcher icon, Android 13+ notification permission,
            app-specific alert channel, and required location/camera permissions.
